# TrueNAS SCALE deployment compose — gluetun + qbittorrent + port-sync stack.
# Secrets injected via Infisical:
#   WIREGUARD_PRIVATE_KEY  — ProtonVPN WireGuard private key
#   QBITTORRENT_PASSWORD   — qBittorrent WebUI password

services:
  gluetun:
    container_name: gluetun
    image: qmcgaw/gluetun:latest
    pull_policy: always
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "30024:30024"
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_ADDRESSES: 10.2.0.2/32
      SERVER_COUNTRIES: United States
      VPN_PORT_FORWARDING: "on"
      VPN_PORT_FORWARDING_PROVIDER: protonvpn
      FIREWALL_OUTBOUND_SUBNETS: 192.168.68.0/24
      FIREWALL_INPUT_PORTS: "30024"
      # --- secret injected by Infisical ---
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
    volumes:
      - /mnt/cell_block_d/apps/qbittorrent-vpn/gluetun:/gluetun
      - /mnt/cell_block_d/apps/qbittorrent-vpn/gluetun-port:/tmp/gluetun
    # gluetun exposes a health server at 127.0.0.1:9999; it only reports
    # healthy once the VPN tunnel is fully established.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9999 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  qbittorrent:
    container_name: qbittorrent
    image: linuxserver/qbittorrent:latest
    restart: unless-stopped
    network_mode: container:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: 568
      PGID: 568
      WEBUI_PORT: 30024
      # Optional pin for VueTorrent init installer; leave unset to pull latest.
      VUETORRENT_VERSION: ${VUETORRENT_VERSION:-}
    volumes:
      - /mnt/cell_block_d/apps/qbittorrent-vpn/config:/config
      - /mnt/cell_block_d/apps/qbittorrent-vpn/downloads:/downloads
      - /mnt/cell_block_d/media:/mnt/cell_block_d/media
      # Cleanup hook: removes stale lockfile/ipc-socket before qbittorrent-nox
      # starts. LSIO runs all scripts in /custom-cont-init.d/ at container
      # startup before s6 brings up services.
      - ./qbittorrent-init/clean-lockfiles.sh:/custom-cont-init.d/clean-lockfiles.sh:ro
      - ./qbittorrent-init/install-vuetorrent.sh:/custom-cont-init.d/install-vuetorrent.sh:ro
    healthcheck:
      # Use the API version endpoint — always 200 when qBittorrent is up,
      # independent of WebUI/theme state (avoids false failures if the
      # alternative UI directory is empty and / returns 404).
      test: ["CMD-SHELL", "curl -s http://localhost:30024/api/v2/app/version -o /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  port-sync:
    container_name: qbittorrent-port-sync
    image: ghcr.io/killakam3084/port-sync:latest
    pull_policy: always
    restart: unless-stopped
    network_mode: container:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
    environment:
      QBITTORRENT_URL: http://127.0.0.1:30024
      QBITTORRENT_USERNAME: admin
      CHECK_INTERVAL: 30
      PORT_FILE: /tmp/gluetun/forwarded_port
      # --- secret injected by Infisical ---
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
    volumes:
      - /mnt/cell_block_d/apps/qbittorrent-vpn/gluetun-port:/tmp/gluetun:ro
    healthcheck:
      # No HTTP endpoint — verify the process is alive
      test: ["CMD-SHELL", "ps | grep -v grep | grep port-sync"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
